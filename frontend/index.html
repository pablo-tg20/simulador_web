<!doctype html>
<!-- index.html — ÚNICA página HTML de la app. Vite la sirve en http://localhost:5173 -->
<!-- lang="es": le dice al navegador y a los lectores de pantalla que el contenido está en español -->
<html lang="es">
  <head>
    <!-- Codificación de caracteres: permite acentos y ñ -->
    <meta charset="UTF-8" />
    <!-- Ícono de la pestaña (archivo en la carpeta public/) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Hace que la página se adapte al ancho de celulares y tablets -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Fuentes Inter (texto) y JetBrains Mono (bits). Sin internet se usan las de respaldo. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <!-- Texto que aparece en la pestaña del navegador -->
    <title>Simulador Binario</title>
  </head>
  <!-- data-op y data-vista los cambia React: el CSS usa esos valores para cambiar los colores -->
  <body data-op="suma" data-vista="numeros">
    <!-- Contenedor vacío: React dibuja TODA la interfaz aquí adentro -->
    <div id="root"></div>
    <!-- Carga el punto de arranque de React (src/main.jsx) -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
